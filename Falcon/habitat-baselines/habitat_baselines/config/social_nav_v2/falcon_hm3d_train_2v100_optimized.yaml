# @package _global_
# OPTIMIZED VERSION - 增加batch size以充分利用VRAM
# Target VRAM usage: ~28GB / 32GB per GPU
# Optimized config for 2x V100 (32GB each)

# 修复内容：
# 1. 降低辅助任务损失权重 (0.1 -> 0.05)
# 2. 添加犹豫惩罚机制
# 3. 调整奖励函数平衡
# 4. 启用学习率衰减
# 5. 增加梯度裁剪
# 6. ⭐ 增加batch size以充分利用VRAM (13.4GB剩余空间)

defaults:
  - /benchmark/nav/socialnav_v2: falcon_hm3d_task_for_train
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_1: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_2: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_3: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_4: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_5: single_fixed
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_6: single_fixed
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_stop: discrete_stop
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_move_forward: discrete_move_forward
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_turn_left: discrete_turn_left
  - /habitat/task/actions@habitat.task.actions.agent_0_discrete_turn_right: discrete_turn_right
  - /habitat/task/actions@habitat.task.actions.agent_1_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_2_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_3_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_4_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_5_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_6_oracle_nav_randcoord_action_obstacle: oracle_nav_action
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_0_pointgoal_with_gps_compass: pointgoal_with_gps_compass_sensor
  - _self_

habitat:
  dataset:
    split: train
  simulator:
    scene_dataset: "data/scene_datasets/hm3d/hm3d.scene_dataset_config.json"
    content_scenes: ["*"]  # 使用所有145个HM3D训练场景
  environment:
    # OPTIMIZATION: Environment diversity settings to avoid overfitting
    iterator_options:
      shuffle: True                   # Shuffle scene groups when cycling
      cycle: True                     # Cycle back to start when all episodes finished
      group_by_scene: True           # Group episodes by scene for efficiency
      max_scene_repeat_episodes: -1  # No episode limit per scene
      max_scene_repeat_steps: 10000  # Max 10K steps per scene (标准最佳实践)
      num_episode_sample: -1         # Use all episodes (-1 = no sampling)
      step_repetition_range: 0.3     # 增强随机性，避免同步场景切换
      seed: 42                       # Random seed for reproducibility
  gym:
    obs_keys:
      - agent_0_articulated_agent_jaw_rgb
      - agent_0_articulated_agent_jaw_depth
      - agent_0_pointgoal_with_gps_compass
      - agent_0_localization_sensor
      - agent_0_human_num_sensor
      - agent_0_oracle_humanoid_future_trajectory
  task:
    actions:
      agent_0_discrete_stop:
        lin_speed: 0.0
        ang_speed: 0.0
      agent_0_discrete_move_forward:
        lin_speed: 25.0
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_turn_left:
        lin_speed: 0.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_0_discrete_turn_right:
        lin_speed: 0.0
        ang_speed: -10.0
        allow_dyn_slide: True
      agent_1_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_2_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_3_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_4_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_5_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
      agent_6_oracle_nav_randcoord_action_obstacle:
        type: OracleNavRandCoordAction_Obstacle
        motion_control: human_joints
        lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True

habitat_baselines:
  evaluate: False
  verbose: True
  trainer_name: "falcon_trainer"
  torch_gpu_id: 0
  tensorboard_dir: "evaluation/falcon/hm3d_2v100_optimized/tb"
  video_dir: "evaluation/falcon/hm3d_2v100_optimized/video"
  test_episode_count: -1

  # OPTIMIZATION 1: 增加并行环境数以利用剩余VRAM
  # 从 8 → 12 → 18 (每增加6个环境约消耗~10GB VRAM)
  num_environments: 18  # Was: 12, optimized for ~30GB/32GB usage

  checkpoint_folder: "evaluation/falcon/hm3d_2v100_optimized/checkpoints"
  num_updates: -1
  total_num_steps: 1638144  # 711 updates × 2304 frames (18 envs × 64 steps × 2 GPUs)
  log_interval: 10
  num_checkpoints: 30  # Adjusted for 711 updates

  # OPTIMIZATION 2: Enable multi-threading
  force_torch_single_threaded: False

  load_resume_state_config: False

  evaluator:
    _target_: habitat_baselines.rl.ppo.falcon_evaluator.FALCONEvaluator

  eval:
    use_ckpt_config: False
    should_load_ckpt: True

  rl:
    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 7
      num_active_agents_per_type: [1, 1, 1, 1, 1, 1, 1]
      num_pool_agents_per_type: [1, 1, 1, 1, 1, 1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1
    policy:
      agent_0:
        name: "PointNavResNetPolicy"
    ppo:
      clip_param: 0.2
      ppo_epoch: 2

      # OPTIMIZATION 3: 增加mini-batch数量以匹配更大的batch size
      # 2304 frames / 9 = 256 samples per mini-batch
      num_mini_batch: 9  # Was: 6, adjusted for 18 envs

      use_amp: True
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 1.5e-4  # FIX: 降低学习率，增加稳定性
      eps: 1e-5
      max_grad_norm: 0.5  # FIX: 从0.2增加到0.5，防止梯度爆炸

      # OPTIMIZATION 4: 保持num_steps，已经很合理
      num_steps: 64  # Rollout length

      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False  # Disabled for cosine schedule

      # Cosine Learning Rate Schedule
      lr_schedule_type: "cosine"
      lr_schedule_params:
        T_max: 711  # Total number of updates (was 1066)
        eta_min: 1.0e-5  # Minimum learning rate

      reward_window_size: 50
      use_normalized_advantage: False

      # Full model size
      hidden_size: 512

      # Double buffered sampling not supported in multi-agent training
      use_double_buffered_sampler: False

    ddppo:
      # OPTIMIZATION 5: Enable distributed training
      sync_frac: 0.6
      distrib_backend: NCCL

      # Use full model pretrained weights
      pretrained_weights: pretrained_model/pretrained_habitat3.pth
      pretrained: True
      pretrained_encoder: False
      train_encoder: True
      reset_critic: True

      # Dual-stream backbone (RGB+Depth, ResNet50-FPN)
      backbone: dual_stream_fpn
      rnn_type: LSTM
      num_recurrent_layers: 2

      # Force distributed mode for multi-GPU training
      force_distributed: True

    # FIX: 降低辅助任务损失权重，防止主导主任务
    auxiliary_losses:
      people_counting:
        max_human_num: 6
        loss_scale: 0.05  # 从0.1降低到0.05
      guess_human_position:
        max_human_num: 6
        position_dim: 2
        loss_scale: 0.05  # 从0.1降低到0.05
      future_trajectory_prediction:
        max_human_num: 6
        future_step: 4
        loss_scale: 0.05  # 从0.1降低到0.05
